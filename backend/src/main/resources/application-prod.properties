# PostgreSQL (required in production). Example Neon:
# jdbc:postgresql://HOST:5432/DB?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

app.security.jwt.issuer=${JWT_ISSUER:fullstack-study}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
app.security.jwt.hmac-secret=${JWT_HMAC_SECRET}

# Frontend origins calling this API (comma-separated).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
